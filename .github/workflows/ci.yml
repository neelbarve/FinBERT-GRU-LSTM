name: CI Pipeline

on:
  push:
    branches: ["main", "dev"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r deployment/requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -q

      - name: Lint
        run: |
          pip install flake8
          flake8 .
